name: Publish Docker

on:
  # Trigger on version tags: a pushed tag (e.g. v0.1.0) is published
  # automatically, with the tag as the image version plus a :latest tag.
  push:
    tags:
      - 'v*'
  # Manual fallback: publish an arbitrary image tag (default: latest).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push to Docker Hub (default: latest)'
        required: false
        default: latest

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.tag }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          TAGS="alswl/excalidraw-room-go:${VERSION}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAGS="${TAGS},alswl/excalidraw-room-go:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
